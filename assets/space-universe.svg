<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
<title id="t">Chaman Afzaal — A Curious Mind in a Vast Universe</title>
<desc id="d">Animated cosmic banner with a spiral galaxy, planets orbiting a sun, a glowing black hole, twinkling stars and Voyager 1 travelling through interstellar space.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".55" stop-color="#15133b"/><stop offset="1" stop-color="#06243a"/></linearGradient>
 <radialGradient id="neb"><stop stop-color="#a45bdb" stop-opacity=".55"/><stop offset="1" stop-color="#11132e" stop-opacity="0"/></radialGradient>
 <radialGradient id="sun"><stop stop-color="#fff3b0"/><stop offset=".55" stop-color="#ffad54"/><stop offset="1" stop-color="#ed5b6b"/></radialGradient>
 <linearGradient id="disk"><stop stop-color="#4ddcff" stop-opacity="0"/><stop offset=".5" stop-color="#d9a7ff"/><stop offset="1" stop-color="#ffad64" stop-opacity="0"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<ellipse cx="360" cy="220" rx="460" ry="280" fill="url(#neb)"/>
<g fill="#fff">
 <circle cx="80" cy="70" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
 <circle cx="480" cy="90" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="660" cy="420" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1450" cy="90" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
 <circle cx="1380" cy="420" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="930" cy="70" r="1.4"/><circle cx="1040" cy="440" r="1.4"/><circle cx="180" cy="360" r="1.5"/>
</g>
<!-- spiral galaxy -->
<g transform="translate(255 210)">
 <ellipse rx="125" ry="45" fill="none" stroke="#9d8cff" stroke-width="12" opacity=".25" filter="url(#blur)"/>
 <path d="M-112 0C-70-100 60-78 100-10S30 80-65 40 0-58 70-20" fill="none" stroke="#c7c4ff" stroke-width="3" opacity=".8"/>
 <path d="M-80-22C-5-90 80-15 35 35S-60 40-35-8 45-38 65 5" fill="none" stroke="#7bdcff" stroke-width="2" opacity=".7"/>
 <circle r="12" fill="#fff4d4" filter="url(#blur)"/>
 <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="80s" repeatCount="indefinite"/>
</g>
<!-- solar system -->
<g transform="translate(790 295)">
 <circle r="34" fill="url(#sun)"/><circle r="55" fill="#ffb45e" opacity=".2" filter="url(#blur)"/>
 <ellipse rx="105" ry="44" fill="none" stroke="#8abaff" stroke-opacity=".5"/>
 <ellipse rx="165" ry="70" fill="none" stroke="#8abaff" stroke-opacity=".35"/>
 <ellipse rx="225" ry="95" fill="none" stroke="#8abaff" stroke-opacity=".25"/>
 <circle cx="105" cy="0" r="9" fill="#5ecbff"/>
 <circle cx="-165" cy="0" r="13" fill="#d98b69"/>
 <circle cx="0" cy="-70" r="7" fill="#c6dfff"/>
 <g><circle cx="225" cy="0" r="16" fill="#a88aff"/><ellipse cx="225" cy="0" rx="29" ry="8" fill="none" stroke="#e0caff" stroke-width="3"/></g>
 <animateTransform attributeName="transform" type="rotate" from="0 790 295" to="360 790 295" dur="60s" repeatCount="indefinite"/>
</g>
<!-- black hole -->
<g transform="translate(1190 210)">
 <ellipse rx="160" ry="52" fill="none" stroke="url(#disk)" stroke-width="24" transform="rotate(-16)" filter="url(#blur)"/>
 <ellipse rx="150" ry="48" fill="none" stroke="#ffbb7a" stroke-width="4" opacity=".9" transform="rotate(-16)"/>
 <circle r="62" fill="#010107"/>
 <ellipse rx="78" ry="78" fill="none" stroke="#9c8bff" stroke-width="4" opacity=".5" filter="url(#blur)"/>
 <animateTransform attributeName="transform" type="rotate" from="0 1190 210" to="360 1190 210" dur="65s" repeatCount="indefinite"/>
</g>
<!-- Voyager 1 travelling outward -->
<path d="M80 445 Q600 410 990 380 T1510 325" fill="none" stroke="#75dcff" stroke-width="2" stroke-dasharray="6 12" opacity=".45"/>
<g transform="translate(100 440)" stroke="#e5f5ff" stroke-width="3" fill="none">
 <path d="M0-12V12M-12 0H12M-8-10L8 10M8-10L-8 10"/>
 <circle r="5" fill="#fff2bf" stroke="none"/>
 <animateMotion path="M0 0 Q430 -20 1000 -120" dur="25s" repeatCount="indefinite"/>
</g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <text x="800" y="92" fill="#fff" font-size="57" font-weight="700" letter-spacing="6">CHAMAN AFZAAL</text>
 <text x="800" y="137" fill="#b7d8ff" font-size="21" letter-spacing="5">A CURIOUS MIND IN A VAST UNIVERSE</text>
 <text x="800" y="490" fill="#b8c9ec" font-size="16" letter-spacing="3">STARS • PLANETS • GALAXIES • BLACK HOLES • DEEP SPACE</text>
 <text x="1385" y="390" fill="#9de8ff" font-size="14" letter-spacing="2">VOYAGER 1</text>
 <text x="1385" y="412" fill="#9aaed1" font-size="11" letter-spacing="1">INTERSTELLAR SPACE</text>
</g>
</svg>