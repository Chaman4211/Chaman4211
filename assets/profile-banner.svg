<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Chaman Afzaal — A Curious Mind in a Vast Universe</title>
<desc id="desc">A cinematic deep-space scene with a luminous nebula, distant spiral galaxy, black hole and accretion disk, a ringed planet, and a dense field of stars.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040d"/><stop offset=".48" stop-color="#080d25"/><stop offset="1" stop-color="#071b2b"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#a64dca" stop-opacity=".48"/><stop offset=".45" stop-color="#3b4cbb" stop-opacity=".24"/><stop offset="1" stop-color="#081126" stop-opacity="0"/></radialGradient>
 <radialGradient id="planet"><stop stop-color="#e8d7bd"/><stop offset=".52" stop-color="#8e829a"/><stop offset=".82" stop-color="#3c4568"/><stop offset="1" stop-color="#101a35"/></radialGradient>
 <linearGradient id="rings"><stop stop-color="#8fc9e8" stop-opacity="0"/><stop offset=".3" stop-color="#b8c9e8" stop-opacity=".9"/><stop offset=".55" stop-color="#e5c6a2" stop-opacity=".8"/><stop offset="1" stop-color="#8fc9e8" stop-opacity="0"/></linearGradient>
 <linearGradient id="disk"><stop stop-color="#6bdcff" stop-opacity="0"/><stop offset=".32" stop-color="#65bfff"/><stop offset=".52" stop-color="#e8b4ff"/><stop offset=".72" stop-color="#ffb26f"/><stop offset="1" stop-color="#6bdcff" stop-opacity="0"/></linearGradient>
 <filter id="bloom"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="field" width="190" height="145" patternUnits="userSpaceOnUse">
  <circle cx="16" cy="22" r="1.1" fill="#fff"/><circle cx="70" cy="84" r=".8" fill="#d6e7ff"/><circle cx="150" cy="35" r="1.2" fill="#fff"/>
  <circle cx="114" cy="124" r=".7" fill="#fff"/><circle cx="177" cy="102" r=".9" fill="#b9caff"/><circle cx="40" cy="130" r=".6" fill="#fff"/>
 </pattern>
</defs>
<rect width="1600" height="520" rx="26" fill="url(#bg)"/>
<rect width="1600" height="520" rx="26" fill="url(#field)" opacity=".85"/>
<ellipse cx="360" cy="255" rx="510" ry="330" fill="url(#nebula)"/>
<ellipse cx="360" cy="255" rx="250" ry="150" fill="#8e58ce" opacity=".10" filter="url(#bloom)"/>
<!-- nebula filaments -->
<g fill="none" stroke-linecap="round">
 <path d="M20 340C170 150 280 410 490 190S710 190 760 50" stroke="#8e77df" stroke-width="38" opacity=".07" filter="url(#bloom)"/>
 <path d="M30 380C190 210 300 430 510 225S700 210 790 75" stroke="#69bfe9" stroke-width="8" opacity=".12" filter="url(#soft)"/>
 <path d="M80 140C230 40 350 190 520 75" stroke="#d18adf" stroke-width="4" opacity=".14" filter="url(#soft)"/>
</g>
<!-- distant spiral galaxy -->
<g transform="translate(300 205)">
 <ellipse rx="142" ry="48" fill="none" stroke="#8b9fe8" stroke-width="18" opacity=".13" filter="url(#soft)"/>
 <path d="M-130 8C-85-93 70-104 123-22S50 100-62 54 6-67 78-34" fill="none" stroke="#c6c4ff" stroke-width="2.5" opacity=".68"/>
 <path d="M-95-38C-25-110 94-50 75 25S-55 76-57-2 58-54 87 0" fill="none" stroke="#83d9f4" stroke-width="2" opacity=".6"/>
 <circle r="17" fill="#fff2d5" opacity=".75" filter="url(#bloom)"/>
 <circle r="5" fill="#fff7e8"/>
 <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="180s" repeatCount="indefinite"/>
</g>
<!-- black hole: dark event horizon and luminous accretion disk -->
<g transform="translate(1190 228)">
 <ellipse rx="230" ry="68" fill="none" stroke="url(#disk)" stroke-width="36" opacity=".75" filter="url(#bloom)" transform="rotate(-13)"/>
 <ellipse rx="215" ry="60" fill="none" stroke="url(#disk)" stroke-width="11" opacity=".95" transform="rotate(-13)"/>
 <ellipse rx="176" ry="48" fill="none" stroke="#f7c5a0" stroke-width="2" opacity=".55" transform="rotate(-13)"/>
 <circle r="68" fill="#000" />
 <circle r="74" fill="none" stroke="#a5a2df" stroke-width="2" opacity=".45" filter="url(#soft)"/>
 <animateTransform attributeName="transform" type="rotate" from="0 1190 228" to="360 1190 228" dur="150s" repeatCount="indefinite"/>
</g>
<!-- ringed planet in foreground -->
<g transform="translate(1460 385)">
 <ellipse rx="112" ry="28" fill="none" stroke="url(#rings)" stroke-width="13" transform="rotate(-18)"/>
 <circle r="57" fill="url(#planet)"/>
 <path d="M-47-16Q0-37 49-10M-52 8Q0-8 54 13" fill="none" stroke="#d9c9bd" stroke-opacity=".22" stroke-width="5"/>
 <ellipse rx="112" ry="28" fill="none" stroke="url(#rings)" stroke-width="5" transform="rotate(-18)"/>
 <animateTransform attributeName="transform" type="rotate" from="0 1460 385" to="360 1460 385" dur="100s" repeatCount="indefinite"/>
</g>
<!-- subtle star glints -->
<g stroke="#d8edff" stroke-linecap="round" opacity=".8">
 <path d="M900 100V118M891 109H909" stroke-width="1.5"><animate attributeName="opacity" values=".15;.9;.15" dur="4s" repeatCount="indefinite"/></path>
 <path d="M680 365V379M673 372H687" stroke-width="1.2"><animate attributeName="opacity" values=".9;.15;.9" dur="3s" repeatCount="indefinite"/></path>
 <path d="M151 75V87M145 81H157" stroke-width="1.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.7s" repeatCount="indefinite"/></path>
</g>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
 <text x="800" y="112" fill="#f7f5ff" font-size="58" font-weight="700" letter-spacing="7">CHAMAN AFZAAL</text>
 <text x="800" y="158" fill="#b9d5f8" font-size="20" letter-spacing="5">AI / ML ENGINEERING  •  DATA SYSTEMS</text>
 <text x="800" y="470" fill="#b6c7e8" font-size="15" letter-spacing="4">CURIOUS ABOUT THE COSMOS  ·  ALWAYS EXPLORING</text>
</g>
</svg>