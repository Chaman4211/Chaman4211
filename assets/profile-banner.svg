<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Chaman Afzaal — Into the unknown</title>
<desc id="desc">A cinematic banner using NASA Goddard's animated black-hole accretion-disk visualization. One title travels toward the black hole, disappears, and reappears on the far side.</desc>
<defs>
 <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#02040a" stop-opacity=".25"/><stop offset=".55" stop-color="#02040a" stop-opacity=".08"/><stop offset="1" stop-color="#02040a" stop-opacity=".88"/></linearGradient>
 <linearGradient id="titleGlow"><stop stop-color="#8ce8ff"/><stop offset=".48" stop-color="#ffffff"/><stop offset="1" stop-color="#d4c7ff"/></linearGradient>
 <filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
 <clipPath id="clip"><rect width="1600" height="560" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1600" height="560" fill="#02040b"/>
 <!-- Authentic NASA Goddard black-hole accretion-disk visualization, animated GIF -->
 <image x="0" y="34" width="1600" height="491" preserveAspectRatio="xMidYMid slice"
  href="https://svs.gsfc.nasa.gov/vis/a010000/a013300/a013326/BH_AccretionDisk_Sim_Banner_Stationary.gif"
  xlink:href="https://svs.gsfc.nasa.gov/vis/a010000/a013300/a013326/BH_AccretionDisk_Sim_Banner_Stationary.gif"/>
 <rect width="1600" height="560" fill="url(#shade)"/>
 <!-- Quiet star field; kept subtle so the NASA visualization remains the hero -->
 <g fill="#fff" opacity=".55">
  <circle cx="88" cy="74" r="1.3"/><circle cx="245" cy="158" r=".9"/><circle cx="390" cy="63" r="1.1"/><circle cx="1280" cy="84" r="1.2"/><circle cx="1480" cy="166" r=".9"/><circle cx="138" cy="440" r="1"/><circle cx="1450" cy="438" r="1.1"/><circle cx="1100" cy="470" r=".8"/>
 </g>
 <!-- The title is ONE text object. It shrinks into the event horizon, vanishes,
      crosses while invisible, then reforms on the far side. No duplicate title. -->
 <g font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="4" text-anchor="middle">
  <text x="0" y="0" fill="#8ce8ff" opacity=".72" filter="url(#glow)">CHAMAN AFZAAL</text>
  <text x="0" y="0" fill="url(#titleGlow)" stroke="#dffaff" stroke-opacity=".35" stroke-width=".7">CHAMAN AFZAAL</text>
  <animateTransform attributeName="transform" type="matrix"
   values="1 0 0 1 330 292; 1 0 0 1 590 292; .025 0 0 .025 790 292; .025 0 0 .025 900 292; 1 0 0 1 1270 292"
   keyTimes="0;.32;.46;.58;1" dur="13s" repeatCount="indefinite"
   calcMode="spline" keySplines=".25 .1 .25 1;.4 0 .6 1;.4 0 .6 1;.25 .1 .25 1"/>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.34;.45;.59;1" dur="13s" repeatCount="indefinite"/>
 </g>
 <!-- Event horizon overlay sits above the moving title and hides it at the point of no return. -->
 <circle cx="800" cy="280" r="67" fill="#000" opacity=".98"/>
 <circle cx="800" cy="280" r="72" fill="none" stroke="#d9c5ff" stroke-opacity=".25" stroke-width="2"/>
 <ellipse cx="800" cy="280" rx="150" ry="34" fill="none" stroke="#9ce8ff" stroke-opacity=".12" stroke-width="3" filter="url(#glow)"/>
 <!-- Only supporting copy; the name is never repeated. -->
 <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="800" y="78" fill="#eaf2ff" opacity=".9" font-size="16" letter-spacing="6">EXPLORING BEYOND THE KNOWN</text>
  <text x="800" y="520" fill="#d4e0f4" opacity=".82" font-size="14" letter-spacing="4">SOFTWARE ENGINEERING  •  DATA  •  AI  •  COSMOS</text>
 </g>
</g>
</svg>